<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>月桂日报 2026-11-16</title>
<style>
body { font-family: -apple-system,"Microsoft YaHei",sans-serif; max-width:960px; margin:0 auto; padding:20px; background:#fafafa; color:#333; }
h1 { font-size:18px; border-bottom:2px solid #333; padding-bottom:8px; margin-top:0; }
h2 { font-size:16px; font-weight:500; color:#333; border-bottom:1px solid #ddd; padding-bottom:6px; margin:32px 0 12px 0; }
h3 { font-size:14px; color:#1565c0; margin:20px 0 8px 0; padding:6px 12px; background:#e3f2fd; border-left:4px solid #1565c0; }
.weibo-body p { font-size:13px; line-height:1.6; margin:8px 0 8px 12px; }
.info { font-size:13px; color:#666; margin-bottom:16px; }
.missing { color:#999; font-size:14px; font-style:italic; padding:12px; }

/* XWLB 表格样式 */
table { width:100%; border-collapse:collapse; font-size:13px; line-height:1.5; background:#fff; }
th { background:#f0f0f0; padding:8px 10px; text-align:left; font-weight:500; border-bottom:1px solid #ddd; }
td { padding:6px 10px; border-bottom:1px solid #eee; vertical-align:top; }
.w { width:30px; text-align:center; }
.sector { white-space:nowrap; min-width:140px; font-weight:500; }
.desc { }
tr.red-row td.sector { color:#c62828; }
tr.red-row { background:#fff5f5; }
tr:hover { background:#f0f0f0 !important; }
tr.red-row:hover { background:#ffe0e0 !important; }

/* Mini 板块样式 */
.num { text-align:center; white-space:nowrap; }
.cause { color:#666; font-size:12px; max-width:240px; }
.bullish { color:#d32f2f; font-weight:500; }
.bearish { color:#2e7d32; font-weight:500; }
.tag-over { background:#ffcdd2; color:#c62828; padding:2px 6px; border-radius:3px; font-size:11px; }
.tag-high { background:#ffe0b2; color:#e65100; padding:2px 6px; border-radius:3px; font-size:11px; }
.tag-mild { background:#c8e6c9; color:#2e7d32; padding:2px 6px; border-radius:3px; font-size:11px; }
.tag-diverge { background:#bbdefb; color:#1565c0; padding:2px 6px; border-radius:3px; font-size:11px; }
.tag-flat { background:#eee; color:#999; padding:2px 6px; border-radius:3px; font-size:11px; }
.fund-in { color:#d32f2f; }
.fund-out { color:#2e7d32; }

/* Tabs */
.tabs { display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid #ddd; }
.tab { padding:10px 20px; font-size:14px; cursor:pointer; border:none; background:none; color:#666; border-bottom:2px solid transparent; margin-bottom:-2px; }
.tab.active { color:#1565c0; border-bottom-color:#1565c0; font-weight:500; }
.tab-content { display:none; }
.tab-content.active { display:block; }
</style></head><body>
<h1>月桂日报 2026-11-16</h1>

<div class="tabs">
  
</div>



<script>
function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}
</script>
</body></html>
